name: Update market data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch WTI and Brent data
        run: node scripts/fetch-market.mjs
      - name: Minimize browser refresh delay
        run: node -e "const fs=require('fs'),p='public/index.html';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace(/setInterval\(load,\d+\)/,'setInterval(load,60000)'))"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
